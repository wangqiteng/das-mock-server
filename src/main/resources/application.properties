# 数据库配置
spring.datasource.url=jdbc:h2:file:./data/mock-server-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2控制台
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring AI配置 (1.0.0-M6版本)
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=gpt-4
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4000

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 服务器配置
server.port=8080

# 日志配置
logging.level.com.dbapp.dasmockserver=DEBUG
logging.level.org.springframework.ai=DEBUG

# 文件存储路径
app.file.upload.path=./uploads/
app.file.generated.path=./generated/
spring.ai.dashscope.api-key: ${AI_DASHSCOPE_API_KEY}
