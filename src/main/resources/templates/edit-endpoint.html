<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑端点 - AI Mock Server</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <style>
        .json-editor {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            min-height: 200px;
            resize: vertical;
        }
        
        .method-badge {
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        /* 固定菜单项宽度，防止位置变化 */
        .navbar-nav .nav-item {
            min-width: 100px;
            text-align: center;
        }
        
        .navbar-nav .nav-link {
            white-space: nowrap;
            padding: 0.5rem 1rem;
        }
        
        /* 确保导航栏布局稳定 */
        .navbar-collapse {
            flex-grow: 1;
        }
        
        .navbar-nav {
            width: 100%;
            justify-content: flex-start;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-magic me-2"></i>AI Mock Server
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload">
                            <i class="fas fa-upload me-1"></i>上传文档
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manage">
                            <i class="fas fa-cogs me-1"></i>服务管理
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="mb-0">
                                <i class="fas fa-edit me-2"></i>编辑API端点
                            </h4>
                            <a th:href="@{'/service/' + ${endpoint.mockService.id}}" class="btn btn-light btn-sm">
                                <i class="fas fa-arrow-left me-1"></i>返回服务详情
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="editEndpointForm">
                            <input type="hidden" id="endpointId" th:value="${endpoint.id}">
                            
                            <!-- 基本信息 -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h5 class="mb-3">基本信息</h5>
                                    
                                    <div class="mb-3">
                                        <label for="endpointName" class="form-label fw-bold">端点名称</label>
                                        <input type="text" class="form-control" id="endpointName" 
                                               th:value="${endpoint.name}" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="endpointPath" class="form-label fw-bold">请求路径</label>
                                        <input type="text" class="form-control" id="endpointPath" 
                                               th:value="${endpoint.path}" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="endpointMethod" class="form-label fw-bold">HTTP方法</label>
                                        <select class="form-select" id="endpointMethod" required>
                                            <option value="GET" th:selected="${endpoint.method.name() == 'GET'}">GET</option>
                                            <option value="POST" th:selected="${endpoint.method.name() == 'POST'}">POST</option>
                                            <option value="PUT" th:selected="${endpoint.method.name() == 'PUT'}">PUT</option>
                                            <option value="DELETE" th:selected="${endpoint.method.name() == 'DELETE'}">DELETE</option>
                                            <option value="PATCH" th:selected="${endpoint.method.name() == 'PATCH'}">PATCH</option>
                                            <option value="HEAD" th:selected="${endpoint.method.name() == 'HEAD'}">HEAD</option>
                                            <option value="OPTIONS" th:selected="${endpoint.method.name() == 'OPTIONS'}">OPTIONS</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="endpointDescription" class="form-label fw-bold">端点描述</label>
                                        <textarea class="form-control" id="endpointDescription" rows="3" 
                                                  th:text="${endpoint.description}"></textarea>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <h5 class="mb-3">响应配置</h5>
                                    
                                    <div class="mb-3">
                                        <label for="statusCode" class="form-label fw-bold">HTTP状态码</label>
                                        <input type="number" class="form-control" id="statusCode" 
                                               th:value="${endpoint.statusCode != null ? endpoint.statusCode : 200}" 
                                               min="100" max="599" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="responseDelay" class="form-label fw-bold">响应延迟 (毫秒)</label>
                                        <input type="number" class="form-control" id="responseDelay" 
                                               th:value="${endpoint.responseDelay != null ? endpoint.responseDelay : 0}" 
                                               min="0" max="30000">
                                        <div class="form-text">设置为0表示无延迟</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="mockResponse" class="form-label fw-bold">Mock响应数据</label>
                                        <textarea class="form-control json-editor" id="mockResponse" rows="10" 
                                                  th:text="${endpoint.mockResponse}"></textarea>
                                        <div class="form-text">请输入有效的JSON格式数据</div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 操作按钮 -->
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">
                                    <i class="fas fa-save me-2"></i>保存更改
                                </button>
                                <a th:href="@{'/service/' + ${endpoint.mockService.id}}" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-times me-2"></i>取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 AI Mock Server. 基于Spring AI Alibaba框架构建</p>
        </div>
    </footer>

    <!-- Toast通知容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1050;">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i id="toastIcon" class="fas fa-info-circle me-2"></i>
                <strong id="toastTitle" class="me-auto">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div id="toastBody" class="toast-body">
                消息内容
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toast通知函数
        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastBody = document.getElementById('toastBody');
            
            // 设置图标和颜色
            let iconClass = 'fas fa-info-circle';
            let headerClass = '';
            
            switch(type) {
                case 'success':
                    iconClass = 'fas fa-check-circle text-success';
                    headerClass = 'text-success';
                    break;
                case 'error':
                    iconClass = 'fas fa-exclamation-circle text-danger';
                    headerClass = 'text-danger';
                    break;
                case 'warning':
                    iconClass = 'fas fa-exclamation-triangle text-warning';
                    headerClass = 'text-warning';
                    break;
                case 'info':
                    iconClass = 'fas fa-info-circle text-info';
                    headerClass = 'text-info';
                    break;
            }
            
            toastIcon.className = iconClass;
            toastTitle.className = `me-auto ${headerClass}`;
            toastTitle.textContent = title;
            toastBody.textContent = message;
            
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
        
        // 表单提交处理
        document.getElementById('editEndpointForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>保存中...';
            saveBtn.disabled = true;
            
            // 验证JSON格式
            const mockResponse = document.getElementById('mockResponse').value;
            try {
                if (mockResponse.trim()) {
                    JSON.parse(mockResponse);
                }
            } catch (error) {
                showToast('error', '格式错误', 'Mock响应数据必须是有效的JSON格式');
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
                return;
            }
            
            // 构建请求数据
            const endpointData = {
                name: document.getElementById('endpointName').value,
                path: document.getElementById('endpointPath').value,
                method: document.getElementById('endpointMethod').value,
                description: document.getElementById('endpointDescription').value,
                statusCode: parseInt(document.getElementById('statusCode').value),
                responseDelay: parseInt(document.getElementById('responseDelay').value) || 0,
                mockResponse: mockResponse
            };
            
            const endpointId = document.getElementById('endpointId').value;
            
            // 发送更新请求
            fetch(`/api/mock-server/endpoints/${endpointId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(endpointData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('更新失败');
                }
            })
            .then(data => {
                showToast('success', '保存成功', '端点信息已成功更新！');
                setTimeout(() => {
                    // 返回服务详情页面
                    window.location.href = `/service/${data.mockServiceId}`;
                }, 1500);
            })
            .catch(error => {
                showToast('error', '保存失败', '更新端点信息时发生错误: ' + error.message);
            })
            .finally(() => {
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            });
        });
        
        // JSON格式验证
        document.getElementById('mockResponse').addEventListener('input', function() {
            const value = this.value.trim();
            if (value) {
                try {
                    JSON.parse(value);
                    this.style.borderColor = '#28a745';
                } catch (error) {
                    this.style.borderColor = '#dc3545';
                }
            } else {
                this.style.borderColor = '#ced4da';
            }
        });
    </script>
</body>
</html>
