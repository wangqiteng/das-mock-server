<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统日志 - AI Mock Server</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        /* 统一导航样式 */
        .navbar-nav .nav-item { min-width: 100px; text-align: center; }
        .navbar-nav .nav-link { white-space: nowrap; padding: 0.5rem 1rem; transition: all 0.3s ease; }
        .navbar-nav .nav-link:hover { transform: translateY(-2px); color: #667eea !important; }
        .navbar-collapse { flex-grow: 1; }
        .navbar-nav { width: 100%; justify-content: flex-start; }
        .navbar-nav.ms-auto { width: auto; margin-left: auto !important; justify-content: flex-end; }

        /* 页头（轻量版）与过渡动画，保持统一感 */
        .hero-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 0; }
        .fade-in { animation: fadeIn 0.6s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .log-container { background: #0b0d10; color: #dfe3e6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; border-radius: 10px; padding: 10px; height: 70vh; overflow-y: auto; font-size: 12px; line-height: 1.35; }
        .toolbar { position: sticky; top: 0; z-index: 10; }
        .controls .btn, .controls .form-select, .controls input { white-space: nowrap; }
        .controls .btn { display: inline-flex; align-items: center; gap: .35rem; }
        .controls { flex-wrap: wrap; gap: .5rem; }
        .log-line { display: grid; grid-template-columns: auto 76px 1fr; gap: 8px; align-items: baseline; padding: 2px 6px; border-radius: 6px; }
        .log-line:hover { background: rgba(255,255,255,0.03); }
        .ts { color: #8a949f; }
        .logger { color: #9aa0a6; }
        .msg { color: #e6e6e6; white-space: pre-wrap; word-break: break-word; }
        .badge-level { font-size: .6rem; letter-spacing: .02em; }
        .badge-DEBUG { background:#2d333b; color:#adb5bd; }
        .badge-INFO { background:#2b5c2f; color:#b7f0c0; }
        .badge-WARN { background:#5b4b1f; color:#ffd57a; }
        .badge-ERROR { background:#5b2326; color:#ffb1b8; }
        .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:#adb5bd; }
        .status-connected { background:#28a745; }
        .status-connecting { background:#ffc107; }
        .status-disconnected { background:#dc3545; }
    </style>
    <script>
        let eventSource = null;
        let isPaused = false;
        let levelFilter = 'ALL';
        let searchKeyword = '';
        let statusEl = null;

        function connect() {
            if (eventSource) { eventSource.close(); }
            eventSource = new EventSource('/api/system-logs/stream');
            eventSource.addEventListener('message', function(e) {
                if (isPaused) return;
                appendLog(e.data);
            });
            eventSource.onopen = function(){ updateStatus('connected', '已连接'); };
            eventSource.onerror = function() {
                updateStatus('connecting', '连接中断，3秒后重试...');
                setTimeout(connect, 3000);
            };
        }

        function appendSystem(text) {
            appendLog(`[SYSTEM] ${text}`);
        }

        function appendLog(line) {
            if (!passLevel(line)) return;
            const container = document.getElementById('logContainer');
            const { ts, lvl, logger, msg } = parseLine(line);

            const row = document.createElement('div');
            row.className = 'log-line';

            const tsSpan = document.createElement('span');
            tsSpan.className = 'ts';
            tsSpan.textContent = ts || '';

            const lvlSpan = document.createElement('span');
            const levelText = lvl || 'INFO';
            lvlSpan.className = `badge badge-level badge-${levelText}`;
            lvlSpan.textContent = levelText;

            const content = document.createElement('div');
            const loggerSpan = document.createElement('span');
            loggerSpan.className = 'logger me-2';
            loggerSpan.textContent = logger ? `[${logger}]` : '';
            const msgSpan = document.createElement('span');
            msgSpan.className = 'msg';
            msgSpan.textContent = msg;

            content.appendChild(loggerSpan);
            content.appendChild(msgSpan);

            // 关键词过滤（本地）
            if (searchKeyword && !line.toLowerCase().includes(searchKeyword.toLowerCase())) {
                return; // 不渲染
            }

            row.appendChild(tsSpan);
            row.appendChild(lvlSpan);
            row.appendChild(content);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function parseLevel(line) {
            const m = line.match(/\[(DEBUG|INFO|WARN|ERROR)\]/);
            return m ? m[1] : null;
        }

        function parseLine(line) {
            // 期望格式: [yyyy-MM-dd HH:mm:ss.SSS][LEVEL][logger] message
            const tsMatch = line.match(/^\[(.*?)\]/);
            const lvlMatch = line.match(/\[(DEBUG|INFO|WARN|ERROR)\]/);
            let logger = '';
            const parts = line.split('] ');
            if (parts.length >= 2) {
                const loggerPart = parts[0].split('][').pop();
                // 当有三个[]时，logger为第三个方括号内容
                const matches = line.match(/\[(.*?)\]/g) || [];
                if (matches.length >= 3) {
                    logger = matches[2].replace(/\[|\]/g, '');
                }
            }
            const msg = line.replace(/^\[.*?\]\[.*?\]\[.*?\]\s*/, '')
                            .replace(/^\[.*?\]\[.*?\]\s*/, '') // 兼容缺少logger的情况
                            .trim();
            return { ts: tsMatch ? tsMatch[1] : '', lvl: lvlMatch ? lvlMatch[1] : null, logger, msg };
        }

        function passLevel(line) {
            if (levelFilter === 'ALL') return true;
            const lvl = parseLevel(line);
            if (!lvl) return true;
            const order = { DEBUG: 1, INFO: 2, WARN: 3, ERROR: 4 };
            switch (levelFilter) {
                case 'DEBUG': return true;
                case 'INFO': return order[lvl] >= order.INFO;
                case 'WARN': return order[lvl] >= order.WARN;
                case 'ERROR': return order[lvl] >= order.ERROR;
                default: return true;
            }
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.innerHTML = isPaused ? '<i class="fas fa-play"></i><span class="ms-1">继续</span>' : '<i class="fas fa-pause"></i><span class="ms-1">暂停</span>';
        }

        function setLevelFilter(value) {
            levelFilter = value;
        }

        function setKeyword(value) {
            searchKeyword = value || '';
        }

        function updateStatus(state, text){
            if (!statusEl) statusEl = document.getElementById('connStatus');
            statusEl.textContent = text;
            statusEl.classList.remove('status-connected','status-connecting','status-disconnected');
            const dot = document.getElementById('connDot');
            dot.classList.remove('status-connected','status-connecting','status-disconnected');
            switch(state){
                case 'connected':
                    statusEl.classList.add('text-success');
                    dot.classList.add('status-connected');
                    break;
                case 'connecting':
                    statusEl.classList.add('text-warning');
                    dot.classList.add('status-connecting');
                    break;
                default:
                    statusEl.classList.add('text-danger');
                    dot.classList.add('status-disconnected');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('connecting', '连接中...');
            connect();
            document.getElementById('levelSelect').addEventListener('change', function(){ setLevelFilter(this.value); });
            document.getElementById('searchInput').addEventListener('input', function(){ setKeyword(this.value); });
        });
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-magic me-2"></i>AI Mock Server
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload"><i class="fas fa-upload me-1"></i>上传文档</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manage"><i class="fas fa-cogs me-1"></i>服务管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/system-logs" title="系统日志">
                            <i class="fas fa-clipboard-list"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex align-items-center gap-2">
                <h6 class="mb-0 text-muted">连接状态</h6>
                <span class="status-dot" id="connDot"></span>
                <small id="connStatus" class="text-muted">连接中...</small>
            </div>
            <div class="controls d-flex align-items-center">
                <select id="levelSelect" class="form-select form-select-sm" style="width: 150px;">
                    <option value="ALL">所有级别</option>
                    <option value="INFO">INFO及以上</option>
                    <option value="WARN">WARN及以上</option>
                    <option value="ERROR">仅ERROR</option>
                    <option value="DEBUG">DEBUG（最详细）</option>
                </select>
                <input id="searchInput" type="text" class="form-control form-control-sm" placeholder="关键词过滤(本地)" style="width: 200px;">
                <div class="btn-group" role="group">
                    <button id="pauseBtn" class="btn btn-sm btn-outline-warning" onclick="togglePause()"><i class="fas fa-pause"></i><span class="ms-1">暂停</span></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="clearLogs()"><i class="fas fa-trash"></i><span class="ms-1">清空</span></button>
                </div>
            </div>
        </div>

        <div id="logContainer" class="log-container"></div>
    </div>

    <!-- 页脚，保持一致 -->
    <footer class="bg-dark text-light py-4 mt-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 AI Mock Server. 基于Spring AI Alibaba框架构建</p>
        </div>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
